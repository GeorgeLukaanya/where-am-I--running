# Docker's embedded DNS server, which every container can reach at this address.
# Re-resolving on a short TTL is what makes scaling visible: `--scale web=3`
# publishes three A records for the name `web`, and Docker rotates them.
resolver 127.0.0.11 valid=5s ipv6=off;

server {
    listen 80;
    server_name _;

    # Why the variable, and not `proxy_pass http://web:8000` directly:
    #
    # A literal address -- or an `upstream { server web:8000; }` block -- is
    # resolved ONCE, while nginx is starting, and the single IP it happens to
    # receive is pinned for the life of the process. Every request would then
    # land on the same replica and the load-balancing demo would silently look
    # like it was doing nothing.
    #
    # Putting the address in a variable defers resolution to request time, so
    # each request asks Docker's DNS again and gets a rotated answer.
    set $upstream http://web:8000;

    location / {
        proxy_pass $upstream;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Fail over to another replica quickly if one is down.
        proxy_connect_timeout 2s;
        proxy_next_upstream error timeout http_502 http_503 http_504;
    }
}
